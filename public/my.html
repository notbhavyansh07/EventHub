<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Registrations | EventHub</title>
  <meta name="description" content="Manage and view the college events and talks you are registered for.">
  <link rel="icon" href="/images/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header>
    <nav aria-label="Main navigation">
      <a class="logo" href="/">
        <span class="logo-badge">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="16" y1="2" x2="16" y2="6"></line>
            <line x1="8" y1="2" x2="8" y2="6"></line>
            <line x1="3" y1="10" x2="21" y2="10"></line>
          </svg>
        </span>
        EventHub
      </a>
      <span id="nav-links"></span>
    </nav>
  </header>

  <main>
    <div style="display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 1rem; margin-bottom: 1.5rem;">
      <div>
        <h1 style="font-size: 2rem; margin-bottom: 0.35rem;">My Event Registrations</h1>
        <p style="color: var(--ink-secondary); font-size: 0.95rem;">Review the workshops and events you have RSVP'd for on campus.</p>
      </div>
      <a href="/" class="btn sec" style="gap: 0.4rem;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        Explore more events
      </a>
    </div>

    <div id="msg" class="msg" role="alert"></div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Event Title</th>
            <th>Category</th>
            <th>Date &amp; Time</th>
            <th>Venue</th>
            <th style="text-align: right;">Action</th>
          </tr>
        </thead>
        <tbody id="rows">
          <tr><td colspan="5" style="text-align: center; color: var(--muted); padding: 2.5rem;">Loading your registrations...</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <footer>
    EventHub &copy; 2026 &middot; Web Development Minor Project &middot; Bhavyansh Salvi (25CS003702) &middot; SPSU
  </footer>

  <script src="/js/common.js"></script>
  <script src="/js/my.js"></script>
</body>
</html>
