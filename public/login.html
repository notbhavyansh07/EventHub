<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login | EventHub</title>
  <meta name="description" content="Log in to EventHub to register for campus events, talks and workshops.">
  <link rel="icon" href="/images/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header>
    <nav aria-label="Main navigation">
      <a class="logo" href="/">
        <span class="logo-badge">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="16" y1="2" x2="16" y2="6"></line>
            <line x1="8" y1="2" x2="8" y2="6"></line>
            <line x1="3" y1="10" x2="21" y2="10"></line>
          </svg>
        </span>
        EventHub
      </a>
      <span id="nav-links"></span>
    </nav>
  </header>

  <main>
    <section class="form-box">
      <h1>Log in</h1>
      <p class="subtitle">Enter your college email to access your registrations and events.</p>

      <form id="form" novalidate>
        <div>
          <label for="email">Email</label>
          <input id="email" type="email" placeholder="student@eventhub.com" required autocomplete="email">
        </div>
        <div>
          <label for="password">Password</label>
          <input id="password" type="password" placeholder="••••••••" required autocomplete="current-password">
        </div>

        <div id="msg" class="msg" role="alert"></div>
        <button class="btn" type="submit">Log in</button>
      </form>

      <p>Don't have an account? <a href="/signup.html">Create an account</a></p>
    </section>
  </main>

  <footer>
    EventHub &copy; 2026 &middot; Web Development Minor Project &middot; Bhavyansh Salvi (25CS003702) &middot; SPSU
  </footer>

  <script src="/js/common.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
